runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 8

env:
  - variable: FIREBASE_PROJECT_ID
    value: instapaper-opds
    availability: [RUNTIME]
  - variable: INSTAPAPER_CONSUMER_KEY
    secret: instapaper-consumer-key
  - variable: INSTAPAPER_CONSUMER_SECRET
    secret: instapaper-consumer-secret
  - variable: TOKEN_ENCRYPTION_KEY
    secret: token-encryption-key
